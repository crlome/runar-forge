# Build + publish release binaries for `v*` tags. Builds for
# linux x86_64/aarch64, macOS arm64 + x86_64, windows x86_64 and uploads,
# per target: an archive (tar.gz / zip) for npm + manual installs, a raw
# binary for `runar update`, and sha256 checksums for both. The publish job
# also generates manifest.json (consumed by `runar update`) and a final job
# publishes the npm shim.
#
# Gates (pinned by `release_pipeline_keeps_its_gates` in
# crates/muninn/src/update.rs): the tag must match the Cargo.toml version,
# every binary the runner can execute must start and report that version,
# npm publishes only after the GitHub release exists, and a missing
# NPM_TOKEN fails the run. workflow_dispatch is the dry run: preflight and
# build run, publish and npm-publish stay tag-only.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fail before five builds when the tag and Cargo.toml disagree: the
  # manifest would advertise a version the binary does not report, and
  # `runar update` (strict equality) would re-offer it forever. The job runs
  # on every trigger, because `build` needs it and a skipped need would skip
  # the workflow_dispatch dry run; only the comparison step is tag-only.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F'"' '/^\[workspace\.package\]/ {p = 1; next} /^\[/ {p = 0} p && /^version *=/ {print $2; exit}' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}: bump Cargo.toml or move the tag"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches Cargo.toml ${cargo_version}"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        # `smoke: true` marks the targets this runner can execute (see the
        # "Smoke the built binary" step).
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            smoke: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          # macos-latest, like ci.yml: a pinned image is retired under the
          # pipeline (macos-14 was, failing both macOS builds before they
          # start). The binaries' minimum macOS comes from rustc's default
          # deployment target, not from the runner image.
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            smoke: true
          # Cross-compile Intel on the arm64 runner — Apple clang cross-builds
          # x86_64 natively, and the Intel hosted runners are being retired,
          # so their labels can hang queued forever.
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            smoke: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p runar-muninn
          else
            cargo build --release --target ${{ matrix.target }} -p runar-muninn
          fi

      - name: Codesign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/runar

      # Run the binary that will be packaged (after codesign, which rewrites
      # it in place on macOS): one that does not start must never ship.
      # aarch64-linux is cross-built and x86_64-apple-darwin is built on an
      # arm64 runner, so neither can run here. On tags the output must name
      # the tag's version.
      - name: Smoke the built binary
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/runar"
          if [ "${{ matrix.archive }}" = "zip" ]; then bin="${bin}.exe"; fi
          out="$("$bin" --version | tr -d '\r')"
          echo "$out"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            want="runar ${GITHUB_REF_NAME#v}"
            if [ "$out" != "$want" ]; then
              echo "::error::$bin --version printed '$out', expected '$want'"
              exit 1
            fi
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          NAME="runar-${{ matrix.target }}"
          OUT="${GITHUB_WORKSPACE}/artifacts"
          mkdir -p "$OUT"
          # hex-only sha256 of a file (for the manifest); GNU or BSD tools.
          raw_sha() { (sha256sum "$1" 2>/dev/null || shasum -a 256 "$1") | awk '{print $1}'; }
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="target/${{ matrix.target }}/release/runar.exe"
            RAW="${NAME}.exe"
            cp "$BIN" "$OUT/runar.exe"
            # archive (for npm + humans)
            (cd "$OUT" && 7z a "${NAME}.zip" runar.exe >/dev/null)
            (cd "$OUT" && certutil -hashfile "${NAME}.zip" SHA256 | grep -v -i "hash" | tr -d ' \r' > "${NAME}.zip.sha256")
            # raw binary + hex-only sha256 (for `runar update`)
            cp "$OUT/runar.exe" "$OUT/${RAW}"
            (cd "$OUT" && raw_sha "${RAW}" > "${RAW}.sha256")
            rm "$OUT/runar.exe"
          else
            BIN="target/${{ matrix.target }}/release/runar"
            RAW="${NAME}"
            cp "$BIN" "$OUT/runar"
            # archive (for npm + humans)
            (cd "$OUT" && tar -czf "${NAME}.tar.gz" runar && (shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" 2>/dev/null || sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"))
            # raw binary + hex-only sha256 (for `runar update`)
            cp "$OUT/runar" "$OUT/${RAW}"
            (cd "$OUT" && raw_sha "${RAW}" > "${RAW}.sha256")
            rm "$OUT/runar"
          fi
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: runar-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.dir }}/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release dir + manifest.json
        shell: bash
        run: |
          set -euo pipefail
          # Flatten every per-target artifact into one dir. Basenames are
          # unique (each is prefixed by its triple), so flattening is safe.
          mkdir -p release
          find artifacts -type f -exec cp -f {} release/ \;

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          RELEASED="$(date -u +%Y-%m-%d)"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          # Triples must match `target_triple()` in crates/muninn/src/update.rs.
          TARGETS=(x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc)

          artifacts_json="{}"
          for t in "${TARGETS[@]}"; do
            case "$t" in *windows*) asset="runar-${t}.exe";; *) asset="runar-${t}";; esac
            sha="$(tr -d ' \r\n' < "release/${asset}.sha256")"
            artifacts_json="$(jq --arg t "$t" --arg url "${BASE}/${asset}" --arg sha "$sha" \
              '. + {($t): {url: $url, sha256: $sha}}' <<<"$artifacts_json")"
          done
          # Schema mirrors Manifest/Channel/Artifact in update.rs.
          jq -n --arg v "$VERSION" --arg r "$RELEASED" --argjson a "$artifacts_json" \
            '{stable: {version: $v, released: $r, artifacts: $a}}' > release/manifest.json

          echo "=== manifest.json ==="; cat release/manifest.json
          echo "=== release/ ==="; ls -1 release/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true

  # Publish the npm packages: one binary-only package per platform
  # (@runar-forge/cli-<os>-<cpu>) plus the launcher meta-package
  # (@runar-forge/cli). No postinstall — the binary is package content, so it
  # installs under `ignore-scripts=true`. Runs only after the GitHub release
  # exists, and a missing NPM_TOKEN fails the run: a release that ships no
  # npm packages must not look green.
  npm-publish:
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish platform packages + launcher
        working-directory: packages/cli-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set: npm users would get nothing for this release. Add the secret and re-run this job."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          ART="${GITHUB_WORKSPACE}/artifacts"

          # triple:os:cpu — os/cpu are Node's process.platform/process.arch values.
          rows="x86_64-unknown-linux-gnu:linux:x64 aarch64-unknown-linux-gnu:linux:arm64 \
                x86_64-apple-darwin:darwin:x64 aarch64-apple-darwin:darwin:arm64 \
                x86_64-pc-windows-msvc:win32:x64"

          # Publish each binary-only platform package first, so the launcher's
          # optionalDependencies already exist in the registry.
          for row in $rows; do
            IFS=: read -r triple os cpu <<<"$row"
            if [ "$os" = "win32" ]; then bin="runar.exe"; src="runar-${triple}.exe"; else bin="runar"; src="runar-${triple}"; fi
            dir="pkgs/cli-${os}-${cpu}"
            mkdir -p "$dir"
            # `-type f`: the download-artifact dir is also named runar-<triple>,
            # so match the raw-binary file, not the directory.
            cp "$(find "$ART" -type f -name "$src" | head -1)" "$dir/$bin"
            chmod +x "$dir/$bin" || true
            jq -n --arg n "@runar-forge/cli-${os}-${cpu}" --arg v "$VERSION" \
                  --arg os "$os" --arg cpu "$cpu" --arg bin "$bin" \
              '{name: $n, version: $v,
                description: ("runar binary for " + $os + "-" + $cpu),
                os: [$os], cpu: [$cpu], files: [$bin], license: "MIT",
                homepage: "https://runar-forge.com",
                repository: {type: "git", url: "git+https://github.com/crlome/runar-forge.git"}}' \
              > "$dir/package.json"
            echo "=== publishing @runar-forge/cli-${os}-${cpu}@${VERSION} ==="
            (cd "$dir" && npm publish --access public)
          done

          # Pin the launcher's version + optionalDependencies to $VERSION, publish last.
          tmp="$(mktemp)"
          jq --arg v "$VERSION" \
            '.version = $v
             | .optionalDependencies = (["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]
                 | map({key: ("@runar-forge/cli-" + .), value: $v}) | from_entries)' \
            package.json > "$tmp" && mv "$tmp" package.json
          echo "=== publishing @runar-forge/cli@${VERSION} ==="
          npm publish --access public
