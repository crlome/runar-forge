# Build + test + lint matrix for every push and PR. Single canonical CI
# pipeline covering Linux, macOS, and Windows so platform-specific regressions
# show up before tag time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy gate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --release

  # The Postgres adapter is ~2,700 lines implementing the same trait as the
  # SQLite one, and the two have diverged silently before. The tests above
  # cannot reach any of its SQL, so they run here against a real server.
  # Ubuntu only: this is about the SQL, not the platform, and paying for it
  # three times buys nothing.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runar
          POSTGRES_PASSWORD: runar_password
          POSTGRES_DB: runar_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runar -d runar_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `--ignored` runs only the live-Postgres tests; they panic rather
      # than skip when the URL is missing, so a broken service shows up as
      # a failure instead of a silently empty run.
      - name: Postgres adapter tests
        env:
          RUNAR_TEST_PG_URL: postgresql://runar:runar_password@localhost:5432/runar_memory
        run: cargo test -p runar-muninn --lib --release -- --ignored
